<h1 style="color:red">Student MFE Loaded ✅</h1>

<div *ngIf="loading(); else content">
  <p>Loading students...</p>
</div>

<ng-template #content>
  <h2>Students List</h2>
  <ul *ngIf="students().length > 0; else noStudents">
    <li *ngFor="let student of students()">
      <strong>{{student.name}}</strong> - {{student.course}} (ID: {{student.id}})
    </li>
  </ul>

  <ng-template #noStudents>
    <p>No students found.</p>
  </ng-template>
</ng-template>

<router-outlet />
